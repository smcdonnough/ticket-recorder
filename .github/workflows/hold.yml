name: Keep a recording longer

# Saves a new copy of an earlier run's hand-off recording (still encrypted) so
# reprocess.yml can use it after the original copy expires: give reprocess.yml
# this run's id instead of the original's.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id of the original recording (or of an earlier hold)
        required: true
      days:
        description: Days to keep the new copy
        default: '7'

permissions:
  contents: read
  actions: read

jobs:
  hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: audio
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: audio
          path: audio.enc
          retention-days: ${{ inputs.days }}
