name: Record The Ticket

on:
  schedule:
    # Times are UTC. GitHub often starts scheduled runs late or drops them,
    # especially on the hour, so each show has several backup triggers. The
    # first to fire records; later ones wait (concurrency below) and then
    # find the show over and exit. record.sh also skips triggers meant for
    # the other daylight/standard-time offset.
    - cron: '47 9 * * 1-5'   # Musers CDT (4:47 AM)
    - cron: '7,22,37 10 * * 1-5'  # Musers CDT backups / CST first
    - cron: '7,22,37 11 * * 1-5'  # Musers CST backups
    - cron: '17 19 * * 1-5'  # Hardline CDT (2:17 PM)
    - cron: '32,47 19 * * 1-5'    # Hardline CDT backups
    - cron: '2,17,32,47 20 * * 1-5'  # Hardline CDT late backups / CST
    - cron: '2,17 21 * * 1-5'     # Hardline CST backups
  workflow_dispatch:
    inputs:
      show:
        description: Test = 10-minute sample; Musers/Hardline = record now until the show ends
        type: choice
        options: [Test, Musers, Hardline]
        default: Test

concurrency:
  group: record-${{ github.event.schedule && (startsWith(github.event.schedule, '47 9') || contains(github.event.schedule, ' 10 ') || contains(github.event.schedule, ' 11 ')) && 'Musers' || github.event.schedule && 'Hardline' || inputs.show }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      recorded: ${{ steps.rec.outputs.recorded }}
      show: ${{ steps.rec.outputs.show }}
      day: ${{ steps.rec.outputs.day }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Record and upload
        id: rec
        env:
          DRIVE_UPLOAD_URL: ${{ secrets.DRIVE_UPLOAD_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          SHOW_INPUT: ${{ inputs.show }}
          OUT_DIR: ${{ runner.temp }}/out
        run: |
          # Which show this trigger is for; the UTC offset check in record.sh
          # drops triggers that belong to the other side of the DST change.
          case "$SCHEDULE" in
            '47 9 * * 1-5')                         set -- Musers -0500 ;;
            '7,22,37 10 * * 1-5')                   set -- Musers ANY ;;
            '7,22,37 11 * * 1-5')                   set -- Musers -0600 ;;
            '17 19 * * 1-5'|'32,47 19 * * 1-5')     set -- Hardline -0500 ;;
            '2,17,32,47 20 * * 1-5')                set -- Hardline ANY ;;
            '2,17 21 * * 1-5')                      set -- Hardline -0600 ;;
            '') set -- "${SHOW_INPUT:-Test}" ANY; export FORCE=1 ;;
            *)  echo "Trigger '$SCHEDULE' is no longer in the schedule. Skipping."; exit 0 ;;
          esac
          case "$1" in
            Musers)   bash record.sh Musers   "$2" 09:05 ;;
            Hardline) bash record.sh Hardline "$2" 19:05 ;;
            *)        MAX_SECONDS=600 bash record.sh Test ANY 00:00 ;;
          esac
      # The repo is public, so the hand-off copy is encrypted and kept for one day.
      - name: Encrypt recording for the next job
        if: steps.rec.outputs.recorded == 'true'
        env:
          PASS: ${{ secrets.DRIVE_UPLOAD_URL }}
        run: |
          cd "${{ runner.temp }}/out"
          openssl enc -aes-256-cbc -pbkdf2 -pass env:PASS -in *.m4a -out audio.enc
      - uses: actions/upload-artifact@v4
        if: steps.rec.outputs.recorded == 'true'
        with:
          name: audio
          path: ${{ runner.temp }}/out/audio.enc
          retention-days: 1
      # GitHub pauses schedules in repos with no activity for 60 days;
      # re-enabling on every run keeps this one going.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/record.yml/enable"

  remove-ads:
    needs: record
    if: needs.record.outputs.recorded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: audio
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper anthropic requests pydantic
      - name: Transcribe, find ads, cut, upload
        env:
          PASS: ${{ secrets.DRIVE_UPLOAD_URL }}
          DRIVE_UPLOAD_URL: ${{ secrets.DRIVE_UPLOAD_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOW: ${{ needs.record.outputs.show }}
          DAY: ${{ needs.record.outputs.day }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PASS -in audio.enc -out audio.m4a
          python process.py audio.m4a "$SHOW" "$DAY"
